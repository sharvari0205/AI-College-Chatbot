<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI College Chatbot</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h2>🎓 College Chatbot</h2>
        <p>Ask me about admissions, courses, fees or exams.</p>

        <div id="chat-box">
            <div class="bot message">
                Hello! Welcome to our college chatbot.
                How can I help you?
            </div>
        </div>

        <form id="chat-form">
            <input id="message" type="text"
                   placeholder="Type your question..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chatBox = document.getElementById("chat-box");

        function addMessage(text, sender) {
            const div = document.createElement("div");
            div.className = sender + " message";
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message: message})
                });

                const data = await response.json();
                addMessage(data.reply, "bot");
            } catch (error) {
                addMessage("Unable to connect. Please try again.", "bot");
            }
        });
    </script>
</body>
</html>
